# Build check for this stripped g2o (the ORB-SLAM2 subset carried by AllFeature-VSLAM as a submodule): configure,
# build and install the library on Linux and on Apple Silicon. There are no unit tests, examples or Qt viewers here,
# so the upstream g2o workflow (unit tests, coverage, Windows/MSVC) does not apply.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu GCC", os: ubuntu-latest }
          - { name: "macOS arm64 clang", os: macos-15 }

    steps:
      - uses: actions/checkout@v4

      - name: Install Eigen (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev ninja-build

      - name: Install Eigen (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build --parallel 3

      - name: Install
        run: cmake --install build

      - name: Installed files
        shell: bash
        run: |
          ls install/lib
          test -f install/lib/cmake/g2o/g2oConfig.cmake || ls -R install/lib/cmake
